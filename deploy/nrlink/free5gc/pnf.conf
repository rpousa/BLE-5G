log_config = {
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
};

L1s = ({
	tr_n_preference  = "nfapi";
  remote_n_address = "192.168.70.140"; // vnf addr
  local_n_address  = "192.168.70.141"; // pnf addr
  local_n_portc    = 50000; // pnf p5 port [!]
  remote_n_portc   = 50001; // vnf p5 port
  local_n_portd    = 50010; // pnf p7 port
  remote_n_portd   = 50011; // vnf p7 port
});

RUs = ({
  local_rf   = "yes"
  nb_tx      = 1
  nb_rx      = 1
  att_tx     = 0
  att_rx     = 0;
  bands      = [78];
  sl_ahead = 2;
  max_pdschReferenceSignalPower = -27;
  max_rxgain = 125;
});

rfsimulator = ({
  serveraddr = "server";
  serverport = 4043;
  options = (); #("saviq"); or/and "chanmod"
  modelname = "AWGN";
});

# nrlink: serve the slot clock (1 slot per over-the-air exchange) to the VNF
time_management = {
  time_source = "iq_samples";
  mode = "server";
  server_ip = "0.0.0.0";
};
