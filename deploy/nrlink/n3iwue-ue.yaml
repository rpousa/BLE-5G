# UE PC (nrlink.sh --role ue): the two non-3GPP UEs, IKEv2/EAP-5G to the N3IWF on the core PC (192.168.70.139).
# --transport ble (default): each UE reaches the N3IWF over its own Bluetooth LE link. ble_ip_link.py moves
#   tun ble<k> (10.70.0.1k) into the container and routes 192.168.70.139 through it; the entrypoint waits for
#   that route (WAIT_IF=ble<k>, set by nrlink.sh) before starting the n3iwue.
# --transport lan: routed subnet 192.168.72.0/24 (no NAT, the n3iwue has no NAT traversal), host route
#   192.168.70.139 via the core PC (ue_routing.sh). WAIT_IF empty.
# Configs are generated by nrlink.sh into ~/oai/nrlink/logs/n3ue/ (IMSI ...041 / ...042, unique IKE/IPsec SPIs).
x-n3ue: &n3ue
    image: free5gc/n3iwue:latest
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    command:
        - bash
        - -c
        - |
          ip route del default && ip route add default via 192.168.72.1 dev eth0 metric 203 || exit 1
          if [ -n "$$WAIT_IF" ]; then
            echo "waiting for the route to the N3IWF through $$WAIT_IF"
            until ip route get 192.168.70.139 2>/dev/null | grep -q "dev $$WAIT_IF "; do sleep 0.5; done
            ip -4 -o addr show "$$WAIT_IF"
          fi
          exec ./n3iwue

services:
    n3iwue1:
        <<: *n3ue
        container_name: nrlink-n3iwue1
        environment: {WAIT_IF: "${N3UE1_IF:-}"}
        volumes: [/home/debian/oai/nrlink/logs/n3ue/n3ue1.yaml:/n3iwue/config/n3ue.yaml]   # writable: the n3iwue saves its SQN there
        networks: {n3ue: {ipv4_address: 192.168.72.11}}
    n3iwue2:
        <<: *n3ue
        container_name: nrlink-n3iwue2
        environment: {WAIT_IF: "${N3UE2_IF:-}"}
        volumes: [/home/debian/oai/nrlink/logs/n3ue/n3ue2.yaml:/n3iwue/config/n3ue.yaml]   # writable: the n3iwue saves its SQN there
        networks: {n3ue: {ipv4_address: 192.168.72.12}}

networks:
    n3ue:
        external: true
        name: nrlink-n3ue-net
